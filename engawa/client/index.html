<!doctype html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>engawa</title>
    <!-- PWA: installable as a standalone desktop app (Chrome/Edge). No service
         worker by design — this is a live WebRTC app with no offline value, and
         reload.ts already handles update prompts (see issue #112). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1d24" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // Polyfills required by simple-peer (Node globals not present in browsers)
      window.global = window;
      window.process = window.process || {
        env: {},
        nextTick: function (cb) {
          var args = Array.prototype.slice.call(arguments, 1);
          queueMicrotask(function () { cb.apply(null, args); });
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1d24;
        color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      #join-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        z-index: 1010;
      }

      #join-overlay .card {
        background: #242832;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 24px 28px;
        min-width: 280px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      #join-overlay h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      #join-overlay input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #1a1d24;
        color: inherit;
        font-size: 15px;
      }

      #join-overlay button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: #4f8cff;
        color: white;
        font-size: 15px;
        cursor: pointer;
        font-weight: 600;
      }

      #join-overlay button:hover {
        background: #3a78f0;
      }

      #toolbar {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        background: rgba(20, 23, 30, 0.9);
        padding: 8px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        /* Stay above the draggable panels (their shared counter starts at 10
           and only climbs) so the toolbar is always clickable. The join
           overlay sits above this as the entry gate. */
        z-index: 1000;
      }

      #toolbar button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: inherit;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        /* Keep buttons a fixed size: never shrink or wrap their label, so a
           narrow viewport can't squeeze them into tall, uneven shapes. */
        flex-shrink: 0;
        white-space: nowrap;
      }

      #toolbar button.active {
        background: #4f8cff;
        border-color: #4f8cff;
        color: white;
      }

      #toolbar button:hover {
        background: #353a47;
      }

      #toolbar button.active:hover {
        background: #3a78f0;
      }

      #toolbar button.recording {
        background: #dc3545;
        border-color: #dc3545;
        color: white;
        animation: rec-pulse 1.5s ease-in-out infinite;
      }

      #toolbar button.recording:hover {
        background: #c82333;
      }

      @keyframes rec-pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.7;
        }
      }

      /* Disabled (e.g. zoom at its min/max): dimmed and non-interactive. */
      #toolbar button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      #toolbar button:disabled:hover {
        background: #2a2f3a;
      }

      /* Zoom controls: a slim [🔍+] [🔍−] pill at the toolbar's right edge. */
      #toolbar .zoom-group>button {
        border-radius: 0;
        border-right: none;
      }

      #toolbar .zoom-group>button:first-child {
        border-top-left-radius: 8px;
        border-bottom-left-radius: 8px;
      }

      #toolbar .zoom-group>button:last-child {
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        border-right: 1px solid #3a4050;
      }

      #toolbar .btn-group {
        position: relative;
        display: flex;
        gap: 0;
        flex-shrink: 0;
      }

      #toolbar .btn-group>#btn-mic,
      #toolbar .btn-group>#btn-cam {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        border-right: none;
      }

      #toolbar .btn-caret {
        padding: 8px 8px;
        font-size: 11px;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }

      .device-menu {
        position: absolute;
        bottom: calc(100% + 6px);
        left: 0;
        min-width: 200px;
        max-width: 320px;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid #3a4050;
        border-radius: 8px;
        padding: 4px;
        z-index: 20;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .device-menu .device-item {
        width: 100%;
        text-align: left;
        padding: 7px 10px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        color: #e6e8ee;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .device-menu .device-item:hover {
        background: #353a47;
      }

      .device-menu .device-item.selected {
        color: #4f8cff;
        font-weight: 600;
      }

      .device-menu .device-empty {
        padding: 8px 10px;
        font-size: 12px;
        color: #9da3b0;
      }

      /* The more menu sits toward the toolbar's right edge; anchor right so it
         doesn't overflow the viewport. */
      #more-menu {
        left: auto;
        right: 0;
        min-width: 180px;
      }

      .device-menu .menu-separator {
        height: 1px;
        background: #3a4050;
        margin: 4px 6px;
      }

      .device-menu .menu-label {
        padding: 5px 10px 2px;
        font-size: 10px;
        color: #7a8090;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Reaction picker: emoji buttons laid out in a compact row. */
      #reaction-menu {
        min-width: 0;
        flex-direction: row;
        flex-wrap: wrap;
        max-width: 220px;
      }

      #reaction-menu .reaction-item {
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      #reaction-menu .reaction-item:hover {
        background: #353a47;
      }

      /* Full-viewport overlay that only acts as a positioning context for the
         draggable tiles. It must not capture pointer events itself, so it never
         blocks canvas interaction; each tile re-enables pointer events. */
      #remote-videos {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      /* ===== Shared panel chrome =====
         Single source of truth for the "header bar + body" panels used by the
         screenshare stage, every camera tile, and the self preview. */
      .panel {
        position: absolute;
        background: rgba(14, 16, 20, 0.92);
        border: 1px solid #353a47;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        resize: both;
        min-width: 160px;
        min-height: 120px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        pointer-events: auto;
        transition: border-color 0.15s ease;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        flex-shrink: 0;
        cursor: grab;
        user-select: none;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.25);
      }

      .panel-header .label {
        font-size: 12px;
        color: #9da3b0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .panel-body {
        flex: 1;
        position: relative;
        min-height: 0;
        width: 100%;
        background: #000;
        overflow: hidden;
      }

      .panel-body video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }

      /* Default (initial) placement. The header preset buttons set explicit
         left/top/width via inline styles, and dragging/resizing override from
         there — presets never lock the window. */
      #self-preview {
        z-index: 5;
        bottom: 80px;
        right: 16px;
        width: 180px;
      }

      #self-preview .panel-body video {
        /* Mirror so motion matches the user's expectations of a mirror. */
        transform: scaleX(-1);
      }

      .remote-tile {
        width: 180px;
      }

      /* Camera windows (tiles + self preview) stay locked to the camera's
         aspect ratio: only the width is resizable and the height follows the
         live video's --cam-aspect, so the face is never cropped. --cam-aspect
         is updated from the real video dimensions in game.ts; 4/3 matches the
         requested 320x240 capture as a fallback. */
      .remote-tile,
      #self-preview {
        height: auto;
        resize: horizontal;
      }

      .remote-tile .panel-body,
      #self-preview .panel-body {
        flex: none;
        aspect-ratio: var(--cam-aspect, 4 / 3);
      }

      .remote-tile.speaking {
        border-color: rgba(80, 220, 120, 0.9);
        box-shadow: 0 0 10px rgba(80, 220, 120, 0.3);
      }

      .remote-tile.muted .panel-body::after,
      #self-preview.muted .panel-body::after {
        content: '🔇';
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(220, 53, 69, 0.85);
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 11px;
        line-height: 1;
      }

      .panel-body .no-video {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1d24;
      }

      .panel-body .no-video-initials {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #3a4050;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        color: #e6e8ee;
      }

      .panel-body .no-video-name {
        margin-top: 8px;
        font-size: 12px;
        color: #9da3b0;
      }

      /* Screenshare stages: one draggable panel per sharing user, created
         dynamically in remote-media.ts (so no display:none here — presence in
         the DOM means it's on screen). The "main" (featured) share — the oldest
         one, or whichever was promoted — gets a blue accent. */
      .screenshare-stage {
        z-index: 6;
        /* Default floating placement for the main stage; later shares and any
           preset/drag/resize override this inline. */
        left: 16px;
        bottom: 80px;
        width: 420px;
        height: 280px;
        min-width: 240px;
        min-height: 180px;
      }

      .screenshare-stage.main {
        border-color: rgba(90, 160, 255, 0.9);
        box-shadow: 0 0 0 1px rgba(90, 160, 255, 0.45), 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      /* Screenshare contains a whole desktop, so letterbox it instead of crop. */
      .screenshare-stage .panel-body video {
        object-fit: contain;
      }

      .stage-controls {
        display: flex;
        gap: 4px;
      }

      .stage-controls button {
        background: rgba(255, 255, 255, 0.08);
        border: none;
        color: #ccc;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }

      .stage-controls button:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      /* ===== Participant roster (top-left, collapsible) ===== */
      #roster {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 232px;
        max-height: calc(100vh - 24px);
        display: flex;
        flex-direction: column;
        background: rgba(20, 23, 30, 0.92);
        border: 1px solid #353a47;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        /* Above the draggable tiles (z starts at 10 and climbs) but below the
           toolbar (z1000), so the list stays clickable. */
        z-index: 900;
        font-size: 13px;
      }

      #roster-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        flex-shrink: 0;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.2);
      }

      #roster-icon {
        font-size: 14px;
        line-height: 1;
      }

      #roster-title {
        font-weight: 600;
        white-space: nowrap;
      }

      #roster-count {
        background: #4f8cff;
        color: white;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
      }

      #roster-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      #roster-actions button,
      #roster-toggle {
        background: transparent;
        border: 0;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        line-height: 1;
      }

      #roster-actions button:hover,
      #roster-toggle:hover {
        background: #353a47;
        color: #e6e8ee;
      }

      /* Status menu is portaled to #app top-level (not nested in the roster's
         overflow:hidden box) so it never clips when the participant list is
         short. roster.ts anchors it under the 🟢 button via getBoundingClientRect
         and sets top/right; it drops downward from the header. */
      #status-menu {
        position: absolute;
        top: 0;
        left: auto;
        right: 0;
        bottom: auto;
        min-width: 160px;
        /* Above the roster (900) / chat (950) / toolbar (1000) so it overlays
           rather than being clipped. */
        z-index: 1100;
      }

      /* Status one-liner + return-time draft fields (#85), above the status list. */
      .status-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 4px 6px;
      }

      .status-field-label {
        font-size: 11px;
        color: #9da3b0;
      }

      .status-note-input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #3a4050;
        background: #1c2027;
        color: #e6e8ee;
        font-size: 12px;
      }

      .status-note-input:focus {
        outline: none;
        border-color: #4f8cff;
      }

      .status-until-row {
        display: flex;
        gap: 4px;
      }

      .status-until-btn {
        flex: 1;
        padding: 5px 0;
        border-radius: 6px;
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: #e6e8ee;
        font-size: 11px;
        cursor: pointer;
      }

      .status-until-btn:hover {
        background: #353a47;
      }

      .status-until-btn.selected {
        border-color: #4f8cff;
        color: #4f8cff;
        font-weight: 600;
      }

      .status-divider {
        height: 1px;
        margin: 4px 6px;
        background: #3a4050;
      }

      #roster-list {
        overflow-y: auto;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      /* Collapsed: hide only the participant list. The header keeps its full
         width and its chat / status buttons, so nothing in the header shifts. */
      #roster.collapsed #roster-header {
        border-bottom: 0;
      }

      #roster.collapsed #roster-list {
        display: none;
      }

      .roster-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        border-left: 3px solid transparent;
        user-select: none;
      }

      .roster-row:hover {
        background: #2a2f3a;
      }

      .roster-row.self {
        background: rgba(79, 140, 255, 0.12);
      }

      .roster-row.self:hover {
        background: rgba(79, 140, 255, 0.2);
      }

      .roster-row.focused {
        background: rgba(255, 196, 0, 0.16);
      }

      .roster-row.speaking {
        border-left-color: rgba(80, 220, 120, 0.9);
      }

      .roster-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* Name + status one-liner stack in a column; this box takes the row's
         free width so name/note ellipsis-truncate instead of pushing siblings. */
      .roster-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .roster-name {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .roster-note {
        font-size: 10px;
        color: #9da3b0;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .roster-note.hidden {
        display: none;
      }

      .roster-status {
        flex-shrink: 0;
        font-size: 12px;
        line-height: 1;
      }

      .roster-go,
      .roster-knock {
        flex-shrink: 0;
        background: #2a2f3a;
        border: 1px solid #3a4050;
        color: #e6e8ee;
        border-radius: 6px;
        width: 24px;
        height: 24px;
        padding: 0;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }

      .roster-go:hover {
        background: #4f8cff;
        border-color: #4f8cff;
        color: white;
      }

      .roster-knock {
        font-size: 11px;
      }

      .roster-knock:hover {
        background: #f0a02a;
        border-color: #f0a02a;
        color: white;
      }

      /* ===== Chat toggle (in roster header) ===== */
      #btn-chat {
        position: relative;
      }

      #btn-chat.active {
        color: #4f8cff;
      }

      /* Unread dot when a message arrives while the panel is closed. */
      #btn-chat.has-unread::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #dc3545;
        border: 1px solid rgba(20, 23, 30, 0.92);
      }

      #chat {
        position: absolute;
        left: 12px;
        bottom: 76px;
        width: 300px;
        max-width: calc(100vw - 24px);
        height: 46vh;
        max-height: calc(100vh - 160px);
        display: flex;
        flex-direction: column;
        background: rgba(20, 23, 30, 0.94);
        border: 1px solid #353a47;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        /* Above the draggable tiles, below the toolbar (z1000) it toggles from. */
        z-index: 950;
        font-size: 13px;
      }

      #chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        flex-shrink: 0;
        font-weight: 600;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.2);
      }

      #chat-close {
        background: transparent;
        border: 0;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        line-height: 1;
      }

      #chat-close:hover {
        background: #353a47;
        color: #e6e8ee;
      }

      #chat-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .chat-msg {
        line-height: 1.35;
        word-break: break-word;
      }

      .chat-msg .chat-who {
        color: #9da3b0;
        font-weight: 600;
        margin-right: 6px;
      }

      .chat-msg.self .chat-who {
        color: #4f8cff;
      }

      .chat-msg .chat-text {
        color: #e6e8ee;
      }

      #chat-form {
        flex-shrink: 0;
        padding: 8px;
        border-top: 1px solid #2a2f3a;
      }

      #chat-input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #1a1d24;
        color: inherit;
        font-size: 13px;
      }

      /* ===== Toasts (top-center stack) for knock requests/replies ===== */
      #toasts {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        /* Below the reload banner (z2000), above the toolbar. */
        z-index: 1500;
        pointer-events: none;
      }

      .toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid #3a4050;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: #e6e8ee;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      .toast.error {
        border-color: #c44a54;
        background: rgba(48, 26, 30, 0.98);
      }

      .toast-msg {
        flex: 1;
      }

      .toast-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .toast-actions button {
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: #e6e8ee;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .toast-actions button:hover {
        background: #353a47;
      }

      .toast-actions button.primary {
        background: #4f8cff;
        border-color: #4f8cff;
        color: white;
      }

      .toast-actions button.primary:hover {
        background: #3a78f0;
      }

      /* ===== Server-update reload banner (top center, above everything) ===== */
      #reload-banner {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: #4f8cff;
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        font-size: 14px;
        z-index: 2000;
      }

      #reload-banner .reload-banner-msg {
        font-weight: 600;
      }

      #reload-banner .reload-banner-countdown {
        opacity: 0.85;
      }

      #reload-banner button {
        border: 0;
        border-radius: 8px;
        background: white;
        color: #1a1d24;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      #reload-banner button:hover {
        background: #e6e8ee;
      }

      /* ===== Debug console (toolbar "⋯" menu) =====
         A scrollable monitor of the active transport's RTC connections. Opens
         top-right but is draggable by its header (makeDraggable normalizes the
         right/top anchor to left/top on first drag). Above the toolbar (z1000)
         so its rows stay readable over the call. */
      #debug-console {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 360px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 120px);
        display: flex;
        flex-direction: column;
        background: rgba(14, 16, 20, 0.96);
        border: 1px solid #353a47;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        z-index: 1100;
        font-size: 12px;
        color: #c9ced8;
        overflow: hidden;
      }

      #debug-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.25);
        font-size: 13px;
        color: #e6e8ee;
        flex-shrink: 0;
        cursor: grab;
        user-select: none;
      }

      #debug-header button {
        background: transparent;
        border: none;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
      }

      #debug-header button:hover {
        color: #fff;
      }

      #debug-body {
        padding: 8px 12px 12px;
        overflow-y: auto;
      }

      .debug-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: #9da3b0;
      }

      .debug-badge {
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #0e1014;
      }

      .debug-badge-mesh {
        background: #6fbf73;
      }

      .debug-badge-sfu {
        background: #5b9bd5;
      }

      .debug-empty,
      .debug-stream-empty {
        color: #6b7280;
        padding: 4px 0;
      }

      .debug-conn {
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 6px 8px;
        margin-bottom: 8px;
        background: rgba(0, 0, 0, 0.2);
      }

      .debug-conn-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }

      .debug-conn-name {
        font-weight: 600;
        color: #e6e8ee;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .debug-rtt {
        color: #9da3b0;
        flex-shrink: 0;
      }

      .debug-stream {
        display: flex;
        gap: 6px;
        padding: 2px 0;
        line-height: 1.5;
      }

      .debug-stream-tag {
        flex-shrink: 0;
        font-variant-emoji: text;
      }

      .debug-stream-send .debug-stream-tag {
        color: #6fbf73;
      }

      .debug-stream-recv .debug-stream-tag {
        color: #5b9bd5;
      }

      .debug-stream-detail {
        color: #c9ced8;
        font-variant-numeric: tabular-nums;
      }

      /* Secondary join button (e.g. "アバターを編集"): muted vs. the blue submit. */
      #join-overlay button.secondary {
        background: #2a2f3a;
        border: 1px solid #3a4050;
      }

      #join-overlay button.secondary:hover {
        background: #353a47;
      }

      /* ===== Character maker modal (#141) ===== */
      #avatar-editor {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        /* Above the join overlay (1010) and the toolbar (1000). */
        z-index: 1200;
      }

      #avatar-editor .avatar-card {
        background: #242832;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 20px 22px;
        width: 320px;
        max-width: calc(100vw - 24px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      #avatar-editor h2 {
        margin: 0;
        font-size: 18px;
        align-self: flex-start;
      }

      #avatar-preview {
        width: 128px;
        height: 150px;
        image-rendering: pixelated;
        background: #1a1d24;
        border: 1px solid #3a4050;
        border-radius: 8px;
      }

      #avatar-categories {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* Many categories now (sex/skin/hair/colors/clothes/…) — cap the height
           and scroll so the card never outgrows the viewport on small screens. */
        max-height: 42vh;
        overflow-y: auto;
      }

      .avatar-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .avatar-row-label {
        width: 56px;
        flex-shrink: 0;
        font-size: 13px;
        color: #9da3b0;
      }

      .avatar-row-value {
        flex: 1;
        text-align: center;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .avatar-step {
        width: 30px;
        flex-shrink: 0;
        padding: 6px 0;
        border-radius: 6px;
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: #e6e8ee;
        font-size: 12px;
        cursor: pointer;
      }

      .avatar-step:hover {
        background: #353a47;
      }

      .avatar-actions {
        width: 100%;
        display: flex;
        gap: 8px;
      }

      .avatar-actions button {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: #4f8cff;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .avatar-actions button:hover {
        background: #3a78f0;
      }

      .avatar-actions button.secondary {
        background: #2a2f3a;
        border: 1px solid #3a4050;
        font-weight: 500;
      }

      .avatar-actions button.secondary:hover {
        background: #353a47;
      }

      .avatar-footer {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #7a8090;
      }

      .avatar-footer a {
        color: #4f8cff;
        text-decoration: none;
      }

      .avatar-footer a:hover {
        text-decoration: underline;
      }

      .avatar-close {
        margin-left: auto;
        background: transparent;
        border: 0;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        line-height: 1;
      }

      .avatar-close:hover {
        background: #353a47;
        color: #e6e8ee;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="roster" class="hidden">
        <div id="roster-header">
          <span id="roster-icon">👥</span>
          <span id="roster-title">参加者</span>
          <span id="roster-count">0</span>
          <div id="roster-actions">
            <button id="btn-chat" title="チャット">💬</button>
            <button id="btn-status" title="ステータス">🟢</button>
          </div>
          <button id="roster-toggle" title="折りたたむ">⟨</button>
        </div>
        <div id="roster-list"></div>
      </div>
      <!-- Portaled out of #roster (which is overflow:hidden) so it never clips
           when the participant list is short. Anchored under #btn-status in JS. -->
      <div id="status-menu" class="device-menu hidden"></div>
      <div id="toolbar" class="hidden">
        <div class="btn-group">
          <button id="btn-mic" title="マイク">🎤 マイク</button>
          <button id="btn-mic-devices" class="btn-caret" title="マイクを選択">▾</button>
          <div id="mic-menu" class="device-menu hidden"></div>
        </div>
        <div class="btn-group">
          <button id="btn-cam" title="カメラ">📷 カメラ</button>
          <button id="btn-cam-devices" class="btn-caret" title="カメラ・背景を選択">▾</button>
          <div id="cam-menu" class="device-menu hidden"></div>
        </div>
        <input id="bg-file" type="file" accept="image/*" class="hidden" />
        <button id="btn-screen" title="画面共有">🖥 画面共有</button>
        <button id="btn-rec" title="録画">⏺ 録画</button>
        <button id="btn-avatar" title="アバターを編集">🧍 アバター</button>
        <div class="btn-group">
          <button id="btn-reaction" title="リアクション">😀</button>
          <div id="reaction-menu" class="device-menu hidden"></div>
        </div>
        <div class="btn-group">
          <button id="btn-more" title="その他">⋯</button>
          <div id="more-menu" class="device-menu hidden"></div>
        </div>
        <div class="btn-group zoom-group">
          <button id="btn-zoom-in" title="拡大">🔍＋</button>
          <button id="btn-zoom-out" title="縮小">🔍−</button>
        </div>
      </div>
      <div id="chat" class="hidden">
        <div id="chat-header">
          <span id="chat-title">💬 チャット</span>
          <button id="chat-close" title="閉じる">✕</button>
        </div>
        <div id="chat-list"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="近くの人にメッセージ…" maxlength="500" autocomplete="off" />
        </form>
      </div>
      <div id="remote-videos"></div>
      <div id="self-preview" class="panel hidden">
        <div class="panel-header" id="self-preview-header">
          <span class="label" id="self-preview-label">あなた</span>
          <div class="stage-controls">
            <button data-mode="pip" title="小窓">🪟</button>
            <button data-mode="side" title="サイドパネル">◧</button>
            <button data-mode="full" title="全画面">⬜</button>
          </div>
        </div>
        <div class="panel-body">
          <video id="self-video" autoplay muted playsinline></video>
        </div>
      </div>
      <!-- Screenshare stages are created dynamically (one per sharing user) by
           remote-media.ts and appended here under #app, as siblings of
           #remote-videos / #self-preview. -->
      <div id="debug-console" class="hidden">
        <div id="debug-header">
          <span>🐛 デバッグ — RTC 接続</span>
          <button id="debug-close" title="閉じる">✕</button>
        </div>
        <div id="debug-body"></div>
      </div>
      <div id="join-overlay">
        <form class="card" id="join-form">
          <h1>engawa に参加</h1>
          <input id="join-name" type="text" placeholder="名前を入力" maxlength="24" autofocus required />
          <input id="join-password" type="password" placeholder="パスワード（任意）" maxlength="64" style="margin-top: 8px;" />
          <button type="button" id="btn-avatar-pre" class="secondary">🎨 アバターを編集</button>
          <button type="submit">入室</button>
        </form>
      </div>
      <!-- Character maker (#141). Owned by ui/avatar-editor.ts; opened from the
           join screen and from the toolbar's 🧍 button. Above the join overlay. -->
      <div id="avatar-editor" class="hidden">
        <div class="avatar-card">
          <h2>アバターを作る</h2>
          <canvas id="avatar-preview" width="128" height="150"></canvas>
          <div id="avatar-categories"></div>
          <div class="avatar-actions">
            <button type="button" id="avatar-random" class="secondary">🎲 おまかせ</button>
            <button type="button" id="avatar-apply">決定</button>
          </div>
          <div class="avatar-footer">
            <span>素材: LPC (CC-BY-SA 等)</span>
            <a id="avatar-credits" href="#" target="_blank" rel="noopener noreferrer">クレジット</a>
            <button type="button" id="avatar-cancel" class="avatar-close" title="閉じる">✕</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/core/main.ts"></script>
  </body>

</html>
