<!doctype html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>engawa</title>
    <!-- PWA: installable as a standalone desktop app (Chrome/Edge). No service
         worker by design — this is a live WebRTC app with no offline value, and
         reload.ts already handles update prompts (see issue #112). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1d24" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/engawa-logo.svg" />
    <link rel="apple-touch-icon" href="/icons/engawa-logo-180.png" />
    <script>
      // Polyfills required by simple-peer (Node globals not present in browsers)
      window.global = window;
      window.process = window.process || {
        env: {},
        nextTick: function (cb) {
          var args = Array.prototype.slice.call(arguments, 1);
          queueMicrotask(function () { cb.apply(null, args); });
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Grounds green shows beyond the map edge instead of black (#229). */
        background: #d2e5bf;
        color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: 100vw;
        /* Use the DYNAMIC viewport height on mobile: plain 100vh includes the
           area behind the browser's address/nav bar, which would push the
           bottom-anchored toolbar off the visible screen (it "doesn't appear").
           dvh matches the actually-visible area; 100vh stays as the fallback. */
        height: 100vh;
        height: 100dvh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      #join-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        z-index: 1010;
      }

      #join-overlay .card {
        background: #242832;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 24px 28px;
        min-width: 280px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      #join-overlay h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      #join-overlay input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #1a1d24;
        color: inherit;
        font-size: 15px;
      }

      #join-overlay button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: #4f8cff;
        color: white;
        font-size: 15px;
        cursor: pointer;
        font-weight: 600;
      }

      #join-overlay button:hover {
        background: #3a78f0;
      }

      /* Language toggle (issue #172): a small segmented control in the overlay
         corner. Overrides the full-width primary button style above. */
      #join-overlay .lang-switch {
        position: absolute;
        top: 18px;
        right: 18px;
        display: flex;
        border: 1px solid #3a4050;
        border-radius: 999px;
        overflow: hidden;
      }

      #join-overlay .lang-switch button {
        margin: 0;
        width: auto;
        padding: 6px 14px;
        border-radius: 0;
        background: transparent;
        color: #aab2c5;
        font-size: 12.5px;
        font-weight: 500;
      }

      #join-overlay .lang-switch button:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      #join-overlay .lang-switch button.active {
        background: #4f8cff;
        color: #fff;
      }

      #join-pass-error {
        margin-top: 8px;
        color: #ff8a8a;
        font-size: 13px;
      }

      .pass-remember {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        color: #aab2c5;
        font-size: 13px;
        cursor: pointer;
      }

      /* Scope under #join-overlay so this beats `#join-overlay input` (an ID
         selector); otherwise the checkbox inherits width:100% and stretches,
         pushing the label onto a second line. */
      #join-overlay .pass-remember input {
        width: auto;
        flex: 0 0 auto;
        margin: 0;
        cursor: pointer;
      }

      .pass-remember span {
        white-space: nowrap;
      }

      /* Bottom-left corner nav (#280): a vertical stack mirroring the toolbar's
         dark pill look. Lives in the lower-left corner, independent of the
         centered toolbar so neither can push the other into a second row. */
      #corner-nav {
        position: absolute;
        bottom: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(20, 23, 30, 0.9);
        padding: 6px;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        z-index: 1000;
      }

      #corner-nav button {
        padding: 5px 6px;
        border-radius: 7px;
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: #e6e8ee;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #corner-nav button:hover {
        background: #353a47;
      }

      #corner-nav button.active {
        background: #4f8cff;
        border-color: #4f8cff;
        color: white;
      }

      #corner-nav button.icon-toggle .ico {
        display: block;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Tooltip anchored to the right of the button (it hugs the left edge, so a
         centered/upward bubble would overflow off-screen). */
      #corner-nav button[data-tip] {
        position: relative;
      }

      #corner-nav button[data-tip]::after,
      #corner-nav button[data-tip]::before {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
        position: absolute;
        top: 50%;
        z-index: 30;
      }

      #corner-nav button[data-tip]::after {
        content: attr(data-tip);
        left: calc(100% + 9px);
        transform: translateY(-50%);
        background: rgba(28, 32, 40, 0.98);
        color: #e6e8ee;
        border: 1px solid #3a4050;
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }

      #corner-nav button[data-tip]::before {
        content: '';
        left: calc(100% + 4px);
        transform: translateY(-50%);
        border: 5px solid transparent;
        border-right-color: rgba(28, 32, 40, 0.98);
      }

      #corner-nav button[data-tip]:hover::after,
      #corner-nav button[data-tip]:hover::before,
      #corner-nav button[data-tip]:focus-visible::after,
      #corner-nav button[data-tip]:focus-visible::before {
        opacity: 1;
      }

      #toolbar {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        background: rgba(20, 23, 30, 0.9);
        padding: 8px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        /* Never let the row clip off-screen: cap it to the viewport and wrap to
           more rows when it can't fit (it stays a single centered row on wide
           screens, where the content is narrower than the cap). Keeps every
           control reachable on phones/tablets. */
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 16px);
        /* Stay above the draggable panels (their shared counter starts at 10
           and only climbs) so the toolbar is always clickable. The join
           overlay sits above this as the entry gate. */
        z-index: 1000;
      }

      #toolbar button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: inherit;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        /* Keep buttons a fixed size: never shrink or wrap their label, so a
           narrow viewport can't squeeze them into tall, uneven shapes. */
        flex-shrink: 0;
        white-space: nowrap;
      }

      #toolbar button.active {
        background: #4f8cff;
        border-color: #4f8cff;
        color: white;
      }

      #toolbar button:hover {
        background: #353a47;
      }

      #toolbar button.active:hover {
        background: #3a78f0;
      }

      #toolbar button.recording {
        background: #dc3545;
        border-color: #dc3545;
        color: white;
        animation: rec-pulse 1.5s ease-in-out infinite;
      }

      #toolbar button.recording:hover {
        background: #c82333;
      }

      @keyframes rec-pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.7;
        }
      }

      /* Joined-pill button group: the icon-only layout modes [▦][▤]. Buttons
         sit flush; only the ends get rounded. */
      #toolbar .layout-group>button {
        border-radius: 0;
        border-right: none;
      }

      #toolbar .layout-group>button:first-child {
        border-top-left-radius: 8px;
        border-bottom-left-radius: 8px;
      }

      #toolbar .layout-group>button:last-child {
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        border-right: 1px solid #3a4050;
      }

      /* Crisp SVG glyphs for the layout toggles (grid = 4 equal tiles, sidebar =
         a big stage + a column of thumbnails) — clearer than the old ▦/▤. */
      #toolbar .layout-group>button>svg {
        display: block;
      }

      /* Custom hover tooltip for icon-only buttons: instant and styled, versus
         the slow, plain native `title`. The label comes from data-tip (set by
         i18n). Shown on hover and keyboard focus. */
      #toolbar button[data-tip] {
        position: relative;
      }

      #toolbar button[data-tip]::after,
      #toolbar button[data-tip]::before {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
        position: absolute;
        left: 50%;
        z-index: 30;
      }

      #toolbar button[data-tip]::after {
        content: attr(data-tip);
        bottom: calc(100% + 9px);
        transform: translateX(-50%);
        background: rgba(28, 32, 40, 0.98);
        color: #e6e8ee;
        border: 1px solid #3a4050;
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }

      #toolbar button[data-tip]::before {
        content: '';
        bottom: calc(100% + 4px);
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: rgba(28, 32, 40, 0.98);
      }

      #toolbar button[data-tip]:hover::after,
      #toolbar button[data-tip]:hover::before,
      #toolbar button[data-tip]:focus-visible::after,
      #toolbar button[data-tip]:focus-visible::before {
        opacity: 1;
      }

      /* The rightmost layout button sits near the viewport edge — anchor its
         tooltip to the right so a centered bubble can't overflow and add a
         horizontal scrollbar. */
      #toolbar .layout-group>button:last-child[data-tip]::after {
        left: auto;
        right: 0;
        transform: none;
      }

      #toolbar .layout-group>button:last-child[data-tip]::before {
        left: auto;
        right: 14px;
        transform: none;
      }

      #toolbar .btn-group {
        position: relative;
        display: flex;
        gap: 0;
        flex-shrink: 0;
      }

      #toolbar .btn-group>#btn-mic,
      #toolbar .btn-group>#btn-cam {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        border-right: none;
      }

      #toolbar .btn-caret {
        padding: 8px 8px;
        font-size: 11px;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }

      /* Icon-only mic/camera toggles: a white glyph with no button border; when
         off, a red diagonal strike is drawn over it so the state reads at a glance. */
      #toolbar button.icon-toggle {
        padding: 7px 10px;
        color: #e6e8ee;
      }

      #toolbar button.icon-toggle .ico {
        display: block;
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #toolbar button.icon-toggle.on {
        color: #46d17f;
      }

      /* Push-to-talk: live mic waiting for the key. */
      #toolbar button.icon-toggle.ptt-idle {
        color: #d9a441;
        opacity: 0.75;
      }

      #toolbar button.icon-toggle .strike {
        display: none;
        stroke: #cc6b6b;
        stroke-width: 3.2;
      }

      #toolbar button.icon-toggle.off .strike {
        display: block;
      }

      /* Record button: a dot when idle, a stop square while recording (the red
         pulsing background comes from .recording). */
      #toolbar button#btn-rec .rec-stop {
        display: none;
      }

      #toolbar button#btn-rec.recording .rec-dot {
        display: none;
      }

      #toolbar button#btn-rec.recording .rec-stop {
        display: block;
      }

      /* "Someone else in the call is recording" badge: a small red dot at the
         button's top-right. Independent of our own .recording state, so both can
         show at once (I'm recording AND so is someone else). */
      #toolbar button#btn-rec {
        position: relative;
      }

      #toolbar button#btn-rec .rec-badge {
        display: none;
        position: absolute;
        top: 3px;
        right: 3px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff4d4f;
        border: 1.5px solid rgba(20, 23, 30, 0.9);
        box-shadow: 0 0 5px rgba(255, 77, 79, 0.9);
        animation: rec-pulse 1.5s ease-in-out infinite;
      }

      #toolbar button#btn-rec.others-recording .rec-badge {
        display: block;
      }

      /* Transcript panel: same shell as the debug console (fixed, draggable by
         its header, scrolling body), parked on the left so both can be open. */
      #transcript {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 400px;
        max-width: calc(100vw - 32px);
        /* Kept short so it doesn't cover the call; older lines scroll. */
        max-height: min(240px, calc(100vh - 140px));
        display: flex;
        flex-direction: column;
        background: rgba(14, 16, 20, 0.96);
        border: 1px solid #353a47;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        z-index: 1100;
        font-size: 13px;
        color: #c9ced8;
        overflow: hidden;
      }

      #transcript-header {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 12px;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.25);
        font-size: 13px;
        color: #e6e8ee;
        flex-shrink: 0;
        cursor: grab;
        user-select: none;
      }

      #transcript-header > span {
        flex: 1;
      }

      #transcript-header button {
        background: transparent;
        border: none;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
      }

      #transcript-header button:hover {
        color: #fff;
      }

      /* min-height: 0 lets the flex child shrink below its content so the
         body scrolls inside the panel instead of being clipped by it. */
      #transcript-body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 8px 12px 12px;
        overflow-y: auto;
        line-height: 1.6;
      }

      /* Room for the summary area on top of the (still short) transcript. */
      #transcript.has-summary {
        max-height: min(420px, calc(100vh - 140px));
      }

      /* On-device summary: its own scrolling area above the lines, so the
         transcript stays as it was. */
      #transcript-summary {
        flex-shrink: 0;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(127, 212, 168, 0.06);
      }

      #transcript-summary.hidden {
        display: none;
      }

      #transcript-summary-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px 0;
        color: #7fd4a8;
        font-weight: 600;
      }

      #transcript-summary-head > span {
        flex: 1;
      }

      #transcript-summary-head button {
        background: transparent;
        border: none;
        color: #9da3b0;
        font-size: 13px;
        cursor: pointer;
        padding: 2px 6px;
      }

      #transcript-summary-head button:hover {
        color: #fff;
      }

      #transcript-summary-body {
        max-height: 160px;
        overflow-y: auto;
        padding: 4px 12px 10px;
        line-height: 1.6;
        color: #dfe3ea;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* Each line is a speech bubble under a "name  time" header; consecutive
         lines from the same speaker stack without repeating the header. */
      .transcript-row {
        margin-top: 10px;
      }

      .transcript-row.continued {
        margin-top: 4px;
      }

      .transcript-meta {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin: 0 0 4px 4px;
      }

      .transcript-time {
        color: #6b7280;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .transcript-who {
        color: #7fd4a8;
        font-weight: 600;
        white-space: nowrap;
      }

      .transcript-text {
        position: relative;
        display: inline-block;
        max-width: 100%;
        box-sizing: border-box;
        padding: 6px 10px;
        background: #262b36;
        border-radius: 12px;
        color: #dfe3ea;
        overflow-wrap: anywhere;
      }

      /* The tail points up at the speaker's name, only on a group's first bubble. */
      .transcript-row:not(.continued) .transcript-text {
        border-top-left-radius: 4px;
      }

      .transcript-row:not(.continued) .transcript-text::before {
        content: '';
        position: absolute;
        top: -5px;
        left: 10px;
        border: 5px solid transparent;
        border-top: 0;
        border-bottom-color: #262b36;
      }

      /* Transcription setup: a small modal for the user's own Groq API key. */
      #transcript-setup {
        position: fixed;
        inset: 0;
        z-index: 1200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }

      #transcript-setup.hidden {
        display: none;
      }

      #transcript-setup .setup-card {
        width: 420px;
        max-width: calc(100vw - 32px);
        background: #171a21;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 20px;
        color: #c9ced8;
        font-size: 13px;
        line-height: 1.6;
      }

      #transcript-setup h2 {
        margin: 0 0 10px;
        font-size: 16px;
        color: #e6e8ee;
      }

      #transcript-setup p {
        margin: 0 0 10px;
        color: #9da3b0;
        font-size: 12px;
      }

      #transcript-setup label {
        display: block;
        margin: 14px 0 4px;
        color: #c9ced8;
        font-size: 12px;
      }

      #transcript-setup input[type='password'],
      #transcript-setup select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        background: #0f1116;
        border: 1px solid #3a4050;
        border-radius: 8px;
        color: #e6e8ee;
        font-size: 13px;
        font-family: inherit;
      }

      #transcript-setup .setup-help {
        margin-top: 4px;
        font-size: 11px;
        color: #6b7280;
      }

      #transcript-setup .setup-help a {
        color: #7fb4ff;
      }

      #transcript-setup .setup-error {
        margin-top: 8px;
        color: #ff8a8c;
        font-size: 12px;
        min-height: 1.2em;
      }

      #transcript-setup .setup-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 18px;
      }

      #transcript-setup .setup-actions button {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #222733;
        color: #d7dbe3;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }

      #transcript-setup .setup-actions button.primary {
        background: #2f6fd0;
        border-color: #2f6fd0;
        color: #fff;
      }

      #transcript-setup .setup-actions button.danger {
        margin-right: auto;
        color: #ff8a8c;
      }

      #transcript-setup .setup-actions button:hover {
        filter: brightness(1.15);
      }

      .device-menu {
        position: absolute;
        bottom: calc(100% + 6px);
        left: 0;
        min-width: 200px;
        max-width: 320px;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid #3a4050;
        border-radius: 8px;
        padding: 4px;
        z-index: 20;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .device-menu .device-item {
        width: 100%;
        text-align: left;
        padding: 7px 10px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        color: #e6e8ee;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .device-menu .device-item:hover {
        background: #353a47;
      }

      .device-menu .device-item.selected {
        color: #4f8cff;
        font-weight: 600;
      }

      .device-menu .device-empty {
        padding: 8px 10px;
        font-size: 12px;
        color: #9da3b0;
      }

      /* The more menu sits toward the toolbar's right edge; anchor right so it
         doesn't overflow the viewport. */
      #more-menu {
        left: auto;
        right: 0;
        min-width: 180px;
      }

      .device-menu .menu-separator {
        height: 1px;
        background: #3a4050;
        margin: 4px 6px;
      }

      .device-menu .menu-label {
        padding: 5px 10px 2px;
        font-size: 10px;
        color: #7a8090;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Virtual-background picker in the cam menu: 5-column thumbnail grid. The
         menu scrolls instead of clipping on short screens. */
      #cam-menu {
        width: 440px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 96px);
        overflow-y: auto;
      }

      .device-menu .bg-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        padding: 2px 6px 6px;
      }

      .device-menu .bg-tile {
        width: 100%;
        aspect-ratio: 16 / 9;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 6px;
        background: #353a47;
        color: #e6e8ee;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .device-menu .bg-tile:hover {
        border-color: #5a6275;
      }

      .device-menu .bg-tile.selected {
        border-color: #4f8cff;
      }

      .device-menu .bg-tile img,
      .device-menu .bg-tile canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Reaction picker: emoji buttons laid out in a compact row. */
      #reaction-menu {
        min-width: 0;
        flex-direction: row;
        flex-wrap: wrap;
        max-width: 220px;
      }

      #reaction-menu .reaction-item {
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      #reaction-menu .reaction-item:hover {
        background: #353a47;
      }

      /* Full-viewport overlay that only acts as a positioning context for the
         draggable tiles. It must not capture pointer events itself, so it never
         blocks canvas interaction; each tile re-enables pointer events. */
      #remote-videos {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      /* ===== Shared panel chrome =====
         Single source of truth for the "header bar + body" panels used by the
         screenshare stage, every camera tile, and the self preview. */
      .panel {
        position: absolute;
        background: rgba(14, 16, 20, 0.92);
        border: 1px solid #353a47;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        pointer-events: auto;
        transition: border-color 0.15s ease;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        /* Fixed height so the header doesn't grow/shrink as the (taller) muted
           mic icon appears and disappears next to the name. */
        min-height: 30px;
        flex-shrink: 0;
        user-select: none;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.25);
      }

      /* Per-connection quality dot (issue #188): green/amber/orange/red. */
      .quality-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        flex: none;
      }
      .quality-dot.q0 { background: #34c759; }
      .quality-dot.q1 { background: #f5c542; }
      .quality-dot.q2 { background: #f08c3c; }
      .quality-dot.q3 { background: #e5484d; }

      .panel-header .label {
        font-size: 12px;
        color: #9da3b0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Maximize (⤢) button at the right end of every panel header. The negative
         margins let it eat the header's own padding, so the tap target is the
         full height of the header instead of the ~13px glyph: on a phone there
         is no Esc key, making this the only way out of the maximized view. */
      .panel-focus-btn {
        flex-shrink: 0;
        margin: -6px -10px -6px 8px;
        padding: 6px 10px;
        border: none;
        background: none;
        color: #ffffff;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
      }

      .panel-focus-btn:hover {
        color: #ffffff;
        opacity: 0.8;
      }

      /* Maximized: the same accent the toolbar uses for an active control. */
      .panel-focus-btn.active {
        color: #4f8cff;
      }

      /* Maximized view: one window fills the area (geometry from reflowLayout)
         and every other window is taken out of the flow entirely. */
      .panel.focused {
        z-index: 20;
      }

      /* Hidden with visibility, NOT display: the recording compositor collects
         its tiles with `offsetParent !== null` (compositor.ts collectTiles), so
         display:none would drop these windows out of the recording too. Being
         maximized is a local viewing choice and must not change what everyone
         else gets recorded (issue #104 gave the recording its own layout for the
         same reason). `.hidden` — the camera-is-off case — stays display:none,
         because those windows really are gone. */
      .panel.focus-hidden {
        visibility: hidden;
      }

      .panel-body {
        flex: 1;
        position: relative;
        min-height: 0;
        width: 100%;
        background: #000;
        overflow: hidden;
      }

      .panel-body video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }

      /* Initial placement only; reflowLayout sets explicit left/top/width inline
         once the preview is shown (it joins the auto-arranged grid). */
      #self-preview {
        z-index: 5;
        bottom: 80px;
        right: 16px;
        width: 180px;
      }

      #self-preview .panel-body video {
        /* Mirror so motion matches the user's expectations of a mirror. */
        transform: scaleX(-1);
      }

      .remote-tile {
        width: 180px;
      }

      /* Camera windows (tiles + self preview) use a FIXED 16:9 aspect so every
         tile is the same shape and the grid stays tidy regardless of each
         camera's real dimensions. The video fills the box with object-fit:cover
         (so it may crop slightly); camera-off placeholders use the same box. */
      .remote-tile,
      #self-preview {
        height: auto;
      }

      .remote-tile .panel-body,
      #self-preview .panel-body {
        flex: none;
        aspect-ratio: 16 / 9;
      }

      /* SFU transport rebuild (issue #254): the panel keeps its last frame,
         dimmed, under a "reconnecting" label instead of disappearing. A stalled
         camera (#312) gets the same box with the stall's reason; a rebuild in
         progress is the better explanation, so it wins. */
      .panel.reconnecting .panel-body::after,
      .panel.stalled .panel-body::after {
        content: attr(data-reconnecting-label);
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 13px;
        pointer-events: none;
      }

      .panel.stalled:not(.reconnecting) .panel-body::after {
        content: attr(data-stall-label);
      }

      .remote-tile.speaking {
        border-color: rgba(80, 220, 120, 0.9);
        box-shadow: 0 0 10px rgba(80, 220, 120, 0.3);
      }

      /* Left side of a panel header: the muted mic icon + the name, grouped so
         the maximize button stays at the far right. */
      /* Per-person volume in a remote tile's header. Dimmed at rest rather than
         hidden: a control that only appears on hover is one nobody finds. It
         takes the same width either way, so nothing shifts when it lights up. */
      .panel-header .vol {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0 6px;
        flex: none;
        opacity: 0.45;
        transition: opacity 0.15s;
      }
      .remote-tile:hover .vol,
      .panel-header .vol:focus-within,
      /* A volume you changed — a silenced peer above all — has to stay legible,
         or their quiet looks like they simply stopped talking. */
      .panel-header .vol.changed {
        opacity: 1;
      }
      .panel-header .vol-icon {
        font-size: 11px;
        line-height: 1;
      }
      /* The slider is drawn by hand: the native track is a thick grey slab that
         sits badly in a 30px header. A hairline that fills to the thumb in the
         toolbar accent reads as a level at a glance, and the notch at the
         halfway point marks the 100% the drag magnets onto. */
      .panel-header .vol-slider {
        --vol-fill: 50%;
        -webkit-appearance: none;
        appearance: none;
        width: 80px;
        height: 12px;
        margin: 0;
        background: transparent;
        cursor: pointer;
        flex: none;
      }
      .panel-header .vol-slider::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 999px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)) 50% / 2px 100% no-repeat,
          linear-gradient(#4f8cff, #4f8cff) 0 / var(--vol-fill) 100% no-repeat,
          rgba(255, 255, 255, 0.18);
      }
      .panel-header .vol-slider::-moz-range-track {
        height: 3px;
        border-radius: 999px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)) 50% / 2px 100% no-repeat,
          linear-gradient(#4f8cff, #4f8cff) 0 / var(--vol-fill) 100% no-repeat,
          rgba(255, 255, 255, 0.18);
      }
      .panel-header .vol-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        /* Centre the thumb on the 3px track. */
        margin-top: -3.5px;
        border-radius: 50%;
        background: #e6e8ee;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
        transition: transform 0.1s;
      }
      .panel-header .vol-slider::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: none;
        border-radius: 50%;
        background: #e6e8ee;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
      }
      .panel-header .vol-slider:hover::-webkit-slider-thumb,
      .panel-header .vol-slider:active::-webkit-slider-thumb {
        transform: scale(1.2);
      }
      /* A fixed slot: the percentage comes and goes without moving the slider. */
      .panel-header .vol-pct {
        width: 30px;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: #4f8cff;
      }
      @media (hover: none) {
        .panel-header .vol {
          opacity: 1;
        }
      }

      .panel-header .header-left {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      /* Muted indicator: a red mic-with-strike icon next to the name (Gather-like),
         shown only while that person's mic is off. Clearly sized so it's readable. */
      .panel-header .mic-indicator {
        display: none;
        flex: none;
        width: 18px;
        height: 18px;
        margin-right: 6px;
        color: #e5484d;
      }

      .panel-header .mic-indicator svg {
        display: block;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .remote-tile.muted .panel-header .mic-indicator,
      #self-preview.muted .panel-header .mic-indicator {
        display: block;
      }

      /* Push-to-talk badge on a peer's tile (hidden while their mic is off,
         where the red mic-off indicator already says enough). */
      .panel-header .ptt-indicator {
        display: none;
        flex: none;
        margin-right: 6px;
        font-size: 15px;
        line-height: 18px;
      }

      .remote-tile.ptt:not(.muted) .panel-header .ptt-indicator {
        display: block;
      }

      .panel-body .no-video {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1d24;
      }

      .panel-body .no-video-initials {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #3a4050;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        color: #e6e8ee;
      }

      .panel-body .no-video-name {
        margin-top: 8px;
        font-size: 12px;
        color: #9da3b0;
      }

      /* Why there is no video (#312): blank when the camera is simply off. */
      .panel-body .no-video-reason {
        margin-top: 6px;
        font-size: 11px;
        color: #d9a441;
        text-align: center;
        padding: 0 8px;
      }

      .panel-body .no-video-reason:empty {
        display: none;
      }

      /* Screenshare stages: one panel per sharing user, created dynamically in
         remote-media.ts (so no display:none here — presence in the DOM means
         it's on screen). Position/size come from reflowLayout. The "main"
         (featured) share — the oldest one, or whichever was promoted by
         click — gets a blue accent. */
      /* A non-main share is clickable: clicking makes it the main one. */
      .screenshare-stage:not(.main) {
        cursor: pointer;
      }

      .screenshare-stage {
        z-index: 6;
        /* Initial frame only; reflowLayout overrides left/top/width/height. */
        left: 16px;
        bottom: 80px;
        width: 420px;
        height: 280px;
      }

      .screenshare-stage.main {
        border-color: rgba(90, 160, 255, 0.9);
        box-shadow: 0 0 0 1px rgba(90, 160, 255, 0.45), 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      /* Screenshare contains a whole desktop, so letterbox it instead of crop. */
      .screenshare-stage .panel-body video {
        object-fit: contain;
      }

      /* ===== Immersive meeting mode (#263) =====
         Entered only while standing in a zone (room/booth/café): a black full-screen
         backdrop (above the 2D map, below the media tiles) and gap-free,
         chrome-less tiles that fill the screen edge-to-edge (Gather-style). */
      #meeting-backdrop {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 4;
        display: none;
      }
      #app.meeting #meeting-backdrop {
        display: block;
      }

      /* In a meeting the panel is just the video: no card border/shadow, square
         corners, name as a bottom overlay. */
      #app.meeting .panel {
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: #000;
      }
      #app.meeting .panel.meeting-hidden {
        display: none;
      }
      /* Tiles trimmed from a capped layout (e.g. the minimized meeting sidebar). */
      .panel.layout-hidden {
        display: none;
      }
      #app.meeting .panel-header {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 0;
        padding: 3px 10px;
        border: none;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        pointer-events: none;
        z-index: 2;
      }
      /* The name sits over live video, which can be any colour — a bright shared
         slide swallowed the old grey text on a faint gradient. White text on its
         own dark pill, plus a shadow, stays legible on light and dark footage. */
      #app.meeting .panel-header .label {
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      /* Maximize affordance is noise in the immersive view — hide it. */
      #app.meeting .panel-focus-btn {
        display: none;
      }
      /* ...but the volume control still has to be grabbable. The header above is
         click-through so the video takes the click; without this the slider is
         visible in meeting mode and does nothing. */
      #app.meeting .panel-header .vol {
        pointer-events: auto;
      }
      /* Tiles are sized explicitly by the meeting layout, so drop the fixed
         camera aspect box and let the body fill the whole panel. */
      #app.meeting .panel-body,
      #app.meeting .remote-tile .panel-body,
      #app.meeting #self-preview .panel-body {
        flex: 1 1 auto;
        height: 100%;
        aspect-ratio: auto;
      }
      /* Ring the speaker from the inside (no border to tint in meeting mode). */
      #app.meeting .remote-tile.speaking {
        box-shadow: inset 0 0 0 3px rgba(80, 220, 120, 0.9);
      }

      /* Filmstrip show-more / show-less toggle, parked at the bottom of the left
         camera column (position set in JS). */
      /* Same chrome as the bottom toolbar buttons, just a large chevron glyph. */
      #filmstrip-toggle {
        position: fixed;
        z-index: 7;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 36px;
        padding: 0;
        border: 1px solid #3a4050;
        border-radius: 8px;
        background: rgba(42, 47, 58, 0.92);
        color: #e6e8ee;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.12s ease;
      }
      #filmstrip-toggle:hover {
        background: rgba(53, 58, 71, 0.95);
      }
      #filmstrip-toggle svg {
        display: block;
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.15s ease;
      }
      /* Expanded = fold back up: same chevron, rotated 180°. */
      #filmstrip-toggle.expanded svg {
        transform: rotate(180deg);
      }

      /* Filmstrip/share seam drag handle (#288): an invisible 10px grab strip
         centered on the seam (translateX(-50%)), with a thin line that lights up
         on hover/drag so the affordance is discoverable but not noisy. */
      #filmstrip-resizer {
        position: fixed;
        z-index: 7;
        width: 10px;
        transform: translateX(-50%);
        cursor: col-resize;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #filmstrip-resizer::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 2px;
        border-radius: 1px;
        background: rgba(230, 232, 238, 0);
        transition: background 0.12s ease;
      }
      #filmstrip-resizer:hover::after,
      #filmstrip-resizer.dragging::after {
        background: rgba(230, 232, 238, 0.75);
      }

      /* Share / pinned-window seam drag handle: the horizontal twin of the
         filmstrip seam, between the share (top) and the clicked tile (bottom). */
      #meeting-split-resizer {
        position: fixed;
        z-index: 7;
        height: 10px;
        transform: translateY(-50%);
        cursor: row-resize;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #meeting-split-resizer::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 4px;
        height: 2px;
        border-radius: 1px;
        background: rgba(230, 232, 238, 0);
        transition: background 0.12s ease;
      }
      #meeting-split-resizer:hover::after,
      #meeting-split-resizer.dragging::after {
        background: rgba(230, 232, 238, 0.75);
      }
      /* Filmstrip tiles pin under the share on click; the pinned one unpins. */
      #app.meeting .panel.meeting-pinnable,
      #app.meeting .panel.meeting-pinned {
        cursor: pointer;
      }
      /* A pinned camera gets a big, oddly shaped pane: letterbox it rather than
         cropping faces off. */
      #app.meeting .panel.meeting-pinned .panel-body video {
        object-fit: contain;
      }

      /* Minimize/restore the immersive meeting — top-left, toolbar chrome. */
      #meeting-minimize {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 8;
        display: none;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid #3a4050;
        border-radius: 8px;
        background: rgba(42, 47, 58, 0.92);
        color: #e6e8ee;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.12s ease;
      }
      #meeting-minimize:hover {
        background: rgba(53, 58, 71, 0.95);
      }
      #meeting-minimize svg {
        display: block;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ===== Participant roster (top-left, collapsible) ===== */
      #status-menu {
        position: absolute;
        top: 0;
        left: auto;
        right: 0;
        bottom: auto;
        min-width: 160px;
        /* Above the roster (900) / chat (950) / toolbar (1000) so it overlays
           rather than being clipped. */
        z-index: 1100;
      }

      /* Avatar action menu, positioned at the click point in JS. Above the tiles
         and toolbar so it's always clickable. */
      #avatar-menu {
        position: absolute;
        min-width: 120px;
        z-index: 1100;
      }

      /* ===== Reaction toasts (bottom-left, Gather-style) — #221 ===== */
      #reaction-toasts {
        position: fixed;
        bottom: 16px;
        left: 16px;
        display: flex;
        flex-direction: column-reverse; /* newest stacks on top */
        gap: 6px;
        /* Above the screenshare (z6) / camera tiles (z5), below the toolbar. */
        z-index: 50;
        pointer-events: none;
      }

      .reaction-toast {
        display: flex;
        align-items: center;
        gap: 8px;
        align-self: flex-start;
        background: rgba(28, 32, 40, 0.92);
        border: 1px solid #3a4050;
        border-radius: 999px;
        padding: 6px 12px;
        color: #e6e8ee;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
      }

      .reaction-toast-name {
        font-size: 13px;
        font-weight: 600;
      }

      .reaction-toast-emoji {
        font-size: 18px;
        line-height: 1;
      }

      /* ===== Keyboard shortcut reference (#297) ===== */
      #keyhelp {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(380px, calc(100% - 32px));
        max-height: calc(100% - 80px);
        display: flex;
        flex-direction: column;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid #3a4050;
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        z-index: 1200;
        overflow: hidden;
        color: #e6e8ee;
      }
      #keyhelp.hidden {
        display: none;
      }
      #keyhelp-list {
        overflow-y: auto;
        padding: 6px 0;
      }
      .keyhelp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 14px;
        font-size: 13px;
      }
      .keyhelp-keys {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      .keyhelp-key {
        min-width: 22px;
        padding: 2px 6px;
        text-align: center;
        background: #2a3040;
        border: 1px solid #454c60;
        border-bottom-width: 2px;
        border-radius: 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #e6e8ee;
      }
      .keyhelp-label {
        color: #b9bfcc;
        text-align: right;
      }
      #keyhelp-note {
        padding: 8px 14px 10px;
        border-top: 1px solid #3a4050;
        color: #8a90a0;
        font-size: 11px;
      }

      /* ===== Desktop notification fix-it guide ===== */
      #notify-help {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, calc(100% - 32px));
        max-height: calc(100% - 80px);
        overflow-y: auto;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid #3a4050;
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        z-index: 1200;
        color: #e6e8ee;
      }
      #notify-help.hidden {
        display: none;
      }
      #notify-help-lead {
        margin: 10px 14px 0;
        color: #b9bfcc;
        font-size: 13px;
      }
      #notify-help-steps {
        margin: 8px 14px 0;
        padding-left: 20px;
        font-size: 13px;
        line-height: 1.6;
      }
      #notify-help-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 14px;
      }
      .notify-help-btn {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #454c60;
        background: #2a3040;
        color: #e6e8ee;
        text-decoration: none;
        cursor: pointer;
      }
      .notify-help-btn.primary {
        background: #3d6fd9;
        border-color: #3d6fd9;
      }

      /* ===== Participant roster (#242) ===== */
      #roster {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 240px;
        max-height: calc(100% - 120px);
        display: flex;
        flex-direction: column;
        background: rgba(28, 32, 40, 0.96);
        border: 1px solid #3a4050;
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        z-index: 1100;
        overflow: hidden;
        color: #e6e8ee;
      }
      #roster.hidden {
        display: none;
      }
      .roster-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid #3a4050;
        font-weight: 600;
        font-size: 13px;
      }
      .roster-close {
        background: none;
        border: none;
        color: #9da3b0;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 4px;
      }
      .roster-close:hover {
        color: #e6e8ee;
      }
      #roster-list {
        overflow-y: auto;
        padding: 4px 0;
      }
      .roster-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        font-size: 13px;
      }
      .roster-row.speaking {
        background: rgba(80, 220, 120, 0.14);
      }
      .roster-row .roster-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .roster-row .roster-icons {
        color: #9da3b0;
        font-size: 12px;
        letter-spacing: 2px;
      }

      /* ===== Toasts (top-center stack) for knock requests/replies ===== */
      #toasts {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        /* Below the reload banner (z2000), above the toolbar. */
        z-index: 1500;
        pointer-events: none;
      }

      .toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid #3a4050;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: #e6e8ee;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      .toast.error {
        border-color: #c44a54;
        background: rgba(48, 26, 30, 0.98);
      }

      .toast-msg {
        flex: 1;
      }

      .toast-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .toast-actions button {
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: #e6e8ee;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .toast-actions button:hover {
        background: #353a47;
      }

      .toast-actions button.primary {
        background: #4f8cff;
        border-color: #4f8cff;
        color: white;
      }

      .toast-actions button.primary:hover {
        background: #3a78f0;
      }

      /* ===== Recording indicator (#315): a red pill under the toasts while WE
         are recording. The file is only saved on ■ Stop (in-browser recording),
         so the pill keeps that fact, plus the elapsed time, in view. Clicks pass
         through: it is status only, the toolbar button does the stopping. ===== */
      #rec-indicator {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(220, 53, 69, 0.96);
        color: white;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        /* Below the reload banner (z2000) and toasts (z1500), above the toolbar. */
        z-index: 1400;
        pointer-events: none;
      }

      .rec-indicator-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: white;
        animation: rec-pulse 1.5s ease-in-out infinite;
      }

      .rec-indicator-time {
        font-variant-numeric: tabular-nums;
        font-weight: 400;
      }

      .rec-indicator-hint {
        font-weight: 400;
        opacity: 0.9;
        border-left: 1px solid rgba(255, 255, 255, 0.45);
        padding-left: 8px;
      }

      /* ===== Server-update reload banner (top center, above everything) ===== */
      #reload-banner {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: #4f8cff;
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        font-size: 14px;
        z-index: 2000;
      }

      #reload-banner .reload-banner-msg {
        font-weight: 600;
      }

      #reload-banner .reload-banner-countdown {
        opacity: 0.85;
      }

      #reload-banner button {
        border: 0;
        border-radius: 8px;
        background: white;
        color: #1a1d24;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      #reload-banner button:hover {
        background: #e6e8ee;
      }

      /* ===== Debug console (toolbar "⋯" menu) =====
         A scrollable monitor of the active transport's RTC connections. Opens
         top-right but is draggable by its header (makeDraggable normalizes the
         right/top anchor to left/top on first drag). Above the toolbar (z1000)
         so its rows stay readable over the call. */
      #debug-console {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 420px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 120px);
        display: flex;
        flex-direction: column;
        background: rgba(14, 16, 20, 0.96);
        border: 1px solid #353a47;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        z-index: 1100;
        font-size: 12px;
        color: #c9ced8;
        overflow: hidden;
      }

      #debug-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid #2a2f3a;
        background: rgba(0, 0, 0, 0.25);
        font-size: 13px;
        color: #e6e8ee;
        flex-shrink: 0;
        cursor: grab;
        user-select: none;
      }

      #debug-header > span {
        flex: 1;
      }

      #debug-header button {
        background: transparent;
        border: none;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
      }

      #debug-header button:hover {
        color: #fff;
      }

      #debug-body {
        padding: 8px 12px 12px;
        overflow-y: auto;
      }

      .debug-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: #9da3b0;
      }

      .debug-badge {
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #0e1014;
      }

      .debug-badge-mesh {
        background: #6fbf73;
      }

      .debug-badge-sfu {
        background: #5b9bd5;
      }

      .debug-empty,
      .debug-stream-empty {
        color: #6b7280;
        padding: 4px 0;
      }

      .debug-conn {
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 6px 8px;
        margin-bottom: 8px;
        background: rgba(0, 0, 0, 0.2);
      }

      /* Verdict colors share the tile quality-dot palette (q0 good … q3 bad). */
      .debug-conn.q0 { border-left: 3px solid #34c759; }
      .debug-conn.q1 { border-left: 3px solid #f5c542; }
      .debug-conn.q2 { border-left: 3px solid #f08c3c; }
      .debug-conn.q3 { border-left: 3px solid #e5484d; }

      .debug-verdict {
        flex-shrink: 0;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #0e1014;
      }
      .debug-verdict.q0 { background: #34c759; }
      .debug-verdict.q1 { background: #f5c542; }
      .debug-verdict.q2 { background: #f08c3c; }
      .debug-verdict.q3 { background: #e5484d; color: #fff; }

      .debug-blame {
        border-radius: 8px;
        padding: 6px 8px;
        margin-bottom: 8px;
        line-height: 1.5;
        color: #e6e8ee;
        background: rgba(52, 199, 89, 0.12);
      }
      .debug-blame.q1 { background: rgba(245, 197, 66, 0.14); }
      .debug-blame.q2 { background: rgba(240, 140, 60, 0.16); }
      .debug-blame.q3 { background: rgba(229, 72, 77, 0.18); }

      .debug-reasons {
        color: #f5a35c;
        line-height: 1.5;
      }

      .debug-notes {
        color: #8a91a0;
        line-height: 1.5;
      }

      .debug-history {
        display: flex;
        gap: 1px;
        height: 8px;
        margin: 4px 0;
      }
      .debug-history i {
        flex: 1;
        border-radius: 1px;
        background: #2a2f3a;
      }
      .debug-history i.q0 { background: #34c759; }
      .debug-history i.q1 { background: #f5c542; }
      .debug-history i.q2 { background: #f08c3c; }
      .debug-history i.q3 { background: #e5484d; }

      .debug-conn-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }

      .debug-conn-name {
        font-weight: 600;
        color: #e6e8ee;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .debug-rtt {
        color: #9da3b0;
        flex-shrink: 0;
      }

      .debug-stream {
        display: flex;
        gap: 6px;
        padding: 2px 0;
        line-height: 1.5;
      }

      .debug-stream-tag {
        flex-shrink: 0;
        font-variant-emoji: text;
      }

      .debug-stream-send .debug-stream-tag {
        color: #6fbf73;
      }

      .debug-stream-recv .debug-stream-tag {
        color: #5b9bd5;
      }

      .debug-stream-detail {
        color: #c9ced8;
        font-variant-numeric: tabular-nums;
      }

      /* Secondary join button (e.g. "アバターを編集"): muted vs. the blue submit. */
      #join-overlay button.secondary {
        background: #2a2f3a;
        border: 1px solid #3a4050;
      }

      #join-overlay button.secondary:hover {
        background: #353a47;
      }

      /* ===== Character maker modal (#141) ===== */
      #avatar-editor {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        /* Above the join overlay (1010) and the toolbar (1000). */
        z-index: 1200;
      }

      #avatar-editor .avatar-card {
        background: #242832;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 20px 22px;
        width: 380px;
        max-width: calc(100vw - 24px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      #avatar-editor h2 {
        margin: 0;
        font-size: 18px;
        align-self: flex-start;
      }

      #avatar-preview {
        width: 128px;
        height: 150px;
        image-rendering: pixelated;
        background: #1a1d24;
        border: 1px solid #3a4050;
        border-radius: 8px;
      }

      #avatar-categories {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* Many categories (sex/skin/hair/colors/clothes/…), and an expanded grid
           can be tall — cap the height and scroll so the card never outgrows the
           viewport. The IntersectionObserver lazy-paints thumbnails as they
           scroll into this container. */
        max-height: 50vh;
        overflow-y: auto;
      }

      /* A collapsible category: clickable header + a grid of option thumbnails. */
      .avatar-cat {
        width: 100%;
      }

      .avatar-cat-head {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #3a4050;
        background: #2a2f3a;
        color: #e6e8ee;
        font-size: 13px;
        cursor: pointer;
      }

      .avatar-cat-head:hover {
        background: #313643;
      }

      .avatar-cat-label {
        flex-shrink: 0;
        color: #9da3b0;
      }

      .avatar-cat-current {
        flex: 1;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .avatar-cat-chevron {
        flex-shrink: 0;
        color: #7a8090;
        font-size: 11px;
      }

      .avatar-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
        gap: 6px;
        padding: 8px 2px 4px;
      }

      .avatar-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px 2px;
        border-radius: 6px;
        border: 1px solid #2f3540;
        background: #1f232c;
        color: #9da3b0;
        cursor: pointer;
        overflow: hidden;
      }

      .avatar-cell:hover {
        border-color: #4f8cff;
      }

      .avatar-cell.selected {
        border-color: #4f8cff;
        background: #2a3340;
        box-shadow: inset 0 0 0 1px #4f8cff;
      }

      .avatar-thumb {
        image-rendering: pixelated;
        background: #15181e;
        border-radius: 4px;
      }

      .avatar-cell-swatch {
        width: 100%;
        height: 40px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.35);
      }

      .avatar-cell-label {
        max-width: 100%;
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .avatar-swatch {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
        border-radius: 3px;
        border: 1px solid rgba(0, 0, 0, 0.35);
      }

      .avatar-actions {
        width: 100%;
        display: flex;
        gap: 8px;
      }

      .avatar-actions button {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: #4f8cff;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .avatar-actions button:hover {
        background: #3a78f0;
      }

      .avatar-actions button.secondary {
        background: #2a2f3a;
        border: 1px solid #3a4050;
        font-weight: 500;
      }

      .avatar-actions button.secondary:hover {
        background: #353a47;
      }

      .avatar-footer {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #7a8090;
      }

      .avatar-footer a {
        color: #4f8cff;
        text-decoration: none;
      }

      .avatar-footer a:hover {
        text-decoration: underline;
      }

      .avatar-close {
        margin-left: auto;
        background: transparent;
        border: 0;
        color: #9da3b0;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        line-height: 1;
      }

      .avatar-close:hover {
        background: #353a47;
        color: #e6e8ee;
      }

      .hidden {
        display: none !important;
      }

      /* ── Mobile / narrow viewports ──────────────────────────────────────────
         Placed last so these overrides win at equal specificity over the base
         rules above. The toolbar is a many-button row; on a phone it must span
         the width and pack tightly (it already wraps via #toolbar's flex-wrap),
         and pop-up menus must stay within the screen. */
      @media (max-width: 640px) {
        #toolbar {
          left: 8px;
          right: 8px;
          /* Clear the home indicator / browser bottom bar (safe-area inset). */
          bottom: calc(8px + env(safe-area-inset-bottom, 0px));
          transform: none;
          max-width: none;
          gap: 6px;
          padding: 6px;
          /* NOTE: no overflow/scroll here — it would clip the device / reaction /
             ⋯ pop-up menus, which open ABOVE the toolbar (outside its box). The
             wrapped toolbar is only a couple of rows tall, so it never overflows
             the top on a phone. */
        }

        #toolbar button {
          padding: 7px 10px;
          font-size: 12px;
        }

        #toolbar .btn-caret {
          padding: 7px 7px;
        }

        /* Keep pop-up menus (device / reactions / more) within the viewport. */
        .device-menu {
          max-width: calc(100vw - 24px);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <!-- Immersive meeting backdrop (#263): a full-screen black layer shown only
           while #app has the `.meeting` class (set when standing in any zone),
           sitting above the 2D map but below the media tiles. -->
      <div id="meeting-backdrop"></div>
      <!-- Self-status menu, opened from the toolbar's status button and anchored
           above it in JS. Top-level so it never clips. -->
      <div id="status-menu" class="device-menu hidden"></div>
      <!-- Action menu shown when you click another avatar: go to them / call. -->
      <div id="avatar-menu" class="device-menu hidden"></div>
      <!-- Participant roster (#242): a toggleable list of everyone in the space,
           so audio-only members hidden from the tile grid are still visible. -->
      <!-- Keyboard shortcut reference (#297), opened from the ⋯ menu. Rows are
           built by ui/keyhelp.ts from the SHORTCUT_HELP table. -->
      <div id="keyhelp" class="hidden">
        <div class="roster-head">
          <span id="keyhelp-title">⌨ キーバインド</span>
          <button id="keyhelp-close" class="roster-close" aria-label="閉じる">✕</button>
        </div>
        <div id="keyhelp-list"></div>
        <div id="keyhelp-note"></div>
      </div>
      <!-- Desktop notification fix-it guide, filled in by ui/notify-help.ts. -->
      <div id="notify-help" class="hidden">
        <div class="roster-head">
          <span id="notify-help-title"></span>
          <button id="notify-help-close" class="roster-close" aria-label="閉じる">✕</button>
        </div>
        <p id="notify-help-lead"></p>
        <ol id="notify-help-steps"></ol>
        <div id="notify-help-actions"></div>
      </div>
      <div id="roster" class="hidden">
        <div class="roster-head">
          <span id="roster-title">参加者</span>
          <button id="roster-close" class="roster-close" aria-label="閉じる">✕</button>
        </div>
        <div id="roster-list"></div>
      </div>
      <!-- Bottom-left corner navigation (#280): roster + zoom controls pulled out
           of the center toolbar so a narrow viewport can't wrap it to two rows.
           Stacked vertically in the lower-left corner. -->
      <div id="corner-nav" class="hidden">
        <button id="btn-roster" data-i18n-tip="roster.title" data-tip="参加者" aria-label="参加者">👥</button>
        <button id="btn-zoom-self" class="icon-toggle" data-i18n-tip="zoom.self" data-tip="自分にズーム" aria-label="自分にズーム">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
            <line x1="12" y1="2" x2="12" y2="5" />
            <line x1="12" y1="19" x2="12" y2="22" />
            <line x1="2" y1="12" x2="5" y2="12" />
            <line x1="19" y1="12" x2="22" y2="12" />
          </svg>
        </button>
        <button id="btn-zoom-fit" class="icon-toggle" data-i18n-tip="zoom.fit" data-tip="全体表示" aria-label="全体表示">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5" />
            <path d="M20 9V4h-5" />
            <path d="M4 15v5h5" />
            <path d="M20 15v5h-5" />
          </svg>
        </button>
      </div>
      <div id="toolbar" class="hidden">
        <div class="btn-group">
          <button id="btn-mic" class="icon-toggle" data-i18n-tip="toolbar.micTitle" data-tip="マイク" aria-label="マイク">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M6 11a6 6 0 0 0 12 0" />
              <line x1="12" y1="17" x2="12" y2="21" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line class="strike" x1="4" y1="20" x2="20" y2="4" />
            </svg>
          </button>
          <button id="btn-mic-devices" class="btn-caret" data-i18n-title="toolbar.selectMic" title="マイクを選択">▾</button>
          <div id="mic-menu" class="device-menu hidden"></div>
        </div>
        <div class="btn-group">
          <button id="btn-cam" class="icon-toggle" data-i18n-tip="toolbar.camTitle" data-tip="カメラ" aria-label="カメラ">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="7" width="12" height="10" rx="2" />
              <path d="M15 10l5-3v10l-5-3z" />
              <line class="strike" x1="4" y1="20" x2="20" y2="4" />
            </svg>
          </button>
          <button id="btn-cam-devices" class="btn-caret" data-i18n-title="toolbar.selectCam" title="カメラ・背景を選択">▾</button>
          <div id="cam-menu" class="device-menu hidden"></div>
        </div>
        <input id="bg-file" type="file" accept="image/*" class="hidden" />
        <button id="btn-screen" class="icon-toggle" data-i18n-tip="toolbar.screenTitle" data-tip="画面共有" aria-label="画面共有">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <path d="M12 14V8" />
            <path d="M9 11l3-3 3 3" />
            <line x1="8" y1="20" x2="16" y2="20" />
          </svg>
        </button>
        <button id="btn-rec" class="icon-toggle" data-i18n-tip="toolbar.recTitle" data-tip="録画" aria-label="録画">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="rec-dot" cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" />
            <circle class="rec-dot" cx="12" cy="12" r="3.5" fill="currentColor" stroke="none" />
            <rect class="rec-stop" x="8" y="8" width="8" height="8" rx="1.5" fill="currentColor" stroke="none" />
          </svg>
          <!-- Privacy badge: a red dot shown when SOMEONE ELSE in the call is
               recording (toggled via .others-recording in JS). -->
          <span class="rec-badge" aria-hidden="true"></span>
        </button>
        <!-- Transcribe (#364): goes red (.recording) while we are transcribing. -->
        <button id="btn-transcript" class="icon-toggle" data-i18n-tip="toolbar.transcriptTitle" data-tip="文字起こし" aria-label="文字起こし">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h9l4 4v14H6z" />
            <path d="M15 3v4h4" />
            <line x1="9" y1="12" x2="16" y2="12" />
            <line x1="9" y1="16" x2="14" y2="16" />
          </svg>
        </button>
        <button id="btn-status" data-i18n-tip="roster.status" data-tip="ステータス" aria-label="ステータス">🟢</button>
        <div class="btn-group">
          <button id="btn-reaction" data-i18n-tip="toolbar.reactions" data-tip="リアクション" aria-label="リアクション">😀</button>
          <div id="reaction-menu" class="device-menu hidden"></div>
        </div>
        <div class="btn-group">
          <button id="btn-more" data-i18n-tip="toolbar.more" data-tip="その他" aria-label="その他">⋯</button>
          <div id="more-menu" class="device-menu hidden"></div>
        </div>
        <div class="btn-group layout-group">
          <button id="btn-layout-grid" data-mode="grid" data-i18n-tip="layout.grid" data-tip="グリッド整列" aria-label="グリッド整列">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
              <rect x="1" y="1" width="6" height="6" rx="1.2" />
              <rect x="9" y="1" width="6" height="6" rx="1.2" />
              <rect x="1" y="9" width="6" height="6" rx="1.2" />
              <rect x="9" y="9" width="6" height="6" rx="1.2" />
            </svg>
          </button>
          <button id="btn-layout-sidebar" data-mode="sidebar" data-i18n-tip="layout.sidebar" data-tip="サイドバー整列" aria-label="サイドバー整列">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
              <rect x="1" y="1" width="9" height="14" rx="1.2" />
              <rect x="12" y="1" width="3" height="4" rx="1" />
              <rect x="12" y="6" width="3" height="4" rx="1" />
              <rect x="12" y="11" width="3" height="4" rx="1" />
            </svg>
          </button>
        </div>
      </div>
      <div id="remote-videos"></div>
      <!-- Filmstrip show-more/less toggle (#263): parked at the bottom of the
           left camera column in meeting presentation mode; positioned/shown in
           JS (RemoteMediaView.positionFilmstripToggle). -->
      <button id="filmstrip-toggle" type="button" style="display: none"></button>
      <!-- Filmstrip/share seam drag handle (#288): resizes the left camera column
           in meeting presentation mode; positioned/shown in JS
           (RemoteMediaView.placeFilmstripResizer). -->
      <div id="filmstrip-resizer" style="display: none"></div>
      <!-- Immersive meeting minimize/restore (#263): top-left toggle to drop the
           full-screen meeting back to floating tiles so the map (and the way
           out of the room) is reachable. Shown/labelled in JS. -->
      <button id="meeting-minimize" type="button" style="display: none"></button>
      <div id="self-preview" class="panel hidden">
        <div class="panel-header">
          <span class="header-left">
            <span class="mic-indicator" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M6 11a6 6 0 0 0 12 0" />
                <line x1="12" y1="17" x2="12" y2="21" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="4" y1="20" x2="20" y2="4" />
              </svg>
            </span>
            <span class="label" id="self-preview-label" data-i18n="common.you">あなた</span>
          </span>
        </div>
        <div class="panel-body">
          <video id="self-video" autoplay muted playsinline></video>
          <!-- Camera-off placeholder so your own tile still shows (initials) in a
               call/meeting, mirroring the remote camera-off tiles (#263). -->
          <div class="no-video" id="self-no-video" style="display: none">
            <span class="no-video-initials" id="self-no-video-initials"></span>
            <span class="no-video-name" id="self-no-video-name"></span>
          </div>
        </div>
      </div>
      <!-- Screenshare stages are created dynamically (one per sharing user) by
           remote-media.ts and appended here under #app, as siblings of
           #remote-videos / #self-preview. -->
      <div id="transcript" class="hidden">
        <div id="transcript-header">
          <span data-i18n="transcript.title">📝 文字起こし</span>
          <button id="transcript-close" data-i18n-title="common.close" title="閉じる">✕</button>
        </div>
        <div id="transcript-summary" class="hidden">
          <div id="transcript-summary-head">
            <span data-i18n="transcript.summaryTitle">✨ 要約</span>
            <button id="transcript-summary-copy" data-i18n-title="transcript.summaryCopy" title="要約をコピー">📋</button>
            <button id="transcript-summary-close" data-i18n-title="common.close" title="閉じる">✕</button>
          </div>
          <div id="transcript-summary-body"></div>
        </div>
        <div id="transcript-body"></div>
      </div>
      <!-- Groq API key setup. The key is the user's own and stays in this
           browser's localStorage; audio goes browser -> Groq directly, never
           through our server (invariant #1). -->
      <div id="transcript-setup" class="hidden">
        <div class="setup-card">
          <h2 data-i18n="transcript.setupTitle">文字起こしの設定</h2>
          <p data-i18n="transcript.setupDesc"></p>
          <p data-i18n="transcript.setupPrivacy"></p>
          <label for="transcript-key" data-i18n="transcript.keyLabel">Groq API キー</label>
          <input id="transcript-key" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_..." />
          <div class="setup-help">
            <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer" data-i18n="transcript.keyHelp">console.groq.com</a>
          </div>
          <div class="setup-error" id="transcript-setup-error"></div>
          <div class="setup-actions">
            <button type="button" id="transcript-forget" class="danger" data-i18n="transcript.clearKey">キーを削除</button>
            <button type="button" id="transcript-cancel" data-i18n="common.cancel">キャンセル</button>
            <button type="button" id="transcript-confirm" class="primary" data-i18n="transcript.setupStart">開始</button>
          </div>
        </div>
      </div>
      <div id="debug-console" class="hidden">
        <div id="debug-header">
          <span data-i18n="debug.title">🐛 デバッグ — RTC 接続</span>
          <button id="debug-close" data-i18n-title="common.close" title="閉じる">✕</button>
        </div>
        <div id="debug-body"></div>
      </div>
      <div id="join-overlay">
        <!-- Language toggle (issue #172): defaults to the browser/OS language,
             persisted on click. Anchored to the overlay corner so it never
             affects the centered card. Wired in core/main.ts. -->
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang-set="ja">日本語</button>
          <button type="button" data-lang-set="en">EN</button>
        </div>
        <!-- Step 1: password gate. Shown by main.ts only when the space requires a
             password (GET /api/config); otherwise skipped entirely. -->
        <form class="card hidden" id="join-pass-form">
          <h1 data-i18n="pass.title">合言葉を入力</h1>
          <input id="join-password" type="password" data-i18n-ph="pass.placeholder" placeholder="パスワード" maxlength="64"
            autocomplete="current-password" />
          <div id="join-pass-error" class="hidden" data-i18n="pass.error">パスワードが正しくありません</div>
          <label class="pass-remember">
            <input id="join-pass-remember" type="checkbox" checked />
            <span data-i18n="pass.remember">この端末で記憶する</span>
          </label>
          <button type="submit" data-i18n="pass.next">次へ</button>
        </form>
        <!-- Step 2: name + avatar. No password field here. -->
        <form class="card hidden" id="join-form">
          <h1 data-i18n="join.title">engawa に参加</h1>
          <input id="join-name" type="text" data-i18n-ph="join.name" placeholder="名前を入力" maxlength="24" required />
          <button type="button" id="btn-avatar-pre" class="secondary" data-i18n="join.editAvatar">🎨 アバターを編集</button>
          <button type="submit" data-i18n="join.enter">入室</button>
        </form>
      </div>
      <!-- Character maker (#141). Owned by ui/avatar-editor.ts; opened from the
           join screen and from the toolbar's 🧍 button. Above the join overlay. -->
      <div id="avatar-editor" class="hidden">
        <div class="avatar-card">
          <h2 data-i18n="avatar.title">アバターを作る</h2>
          <canvas id="avatar-preview" width="128" height="150"></canvas>
          <div id="avatar-categories"></div>
          <div class="avatar-actions">
            <button type="button" id="avatar-random" class="secondary" data-i18n="avatar.random">🎲 おまかせ</button>
            <button type="button" id="avatar-apply" data-i18n="avatar.confirm">決定</button>
          </div>
          <div class="avatar-footer">
            <span data-i18n="avatar.credit">素材: LPC (CC-BY-SA 等)</span>
            <a id="avatar-credits" href="#" target="_blank" rel="noopener noreferrer" data-i18n="avatar.credits">クレジット</a>
            <button type="button" id="avatar-cancel" class="avatar-close" data-i18n-title="common.close" title="閉じる">✕</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/core/main.ts"></script>
  </body>

</html>
