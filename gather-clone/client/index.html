<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>engawa</title>
    <script>
      // Polyfills required by simple-peer (Node globals not present in browsers)
      window.global = window;
      window.process = window.process || {
        env: {},
        nextTick: function (cb) {
          var args = Array.prototype.slice.call(arguments, 1);
          queueMicrotask(function () { cb.apply(null, args); });
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1d24;
        color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #app { position: relative; width: 100vw; height: 100vh; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; }

      #join-overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        z-index: 10;
      }
      #join-overlay .card {
        background: #242832;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 24px 28px;
        min-width: 280px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      }
      #join-overlay h1 { margin: 0 0 16px; font-size: 20px; }
      #join-overlay input {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #3a4050; background: #1a1d24; color: inherit;
        font-size: 15px;
      }
      #join-overlay button {
        margin-top: 12px; width: 100%; padding: 10px 12px;
        border-radius: 8px; border: 0; background: #4f8cff; color: white;
        font-size: 15px; cursor: pointer; font-weight: 600;
      }
      #join-overlay button:hover { background: #3a78f0; }

      #hud {
        position: absolute; top: 12px; left: 12px;
        display: flex; gap: 8px; align-items: center;
        background: rgba(20, 23, 30, 0.85);
        padding: 8px 12px; border-radius: 8px;
        font-size: 13px; pointer-events: none;
      }
      #hud .badge { background: #4f8cff; color: white; padding: 2px 8px; border-radius: 999px; font-size: 11px; }

      #toolbar {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px;
        background: rgba(20, 23, 30, 0.9);
        padding: 8px; border-radius: 12px;
        backdrop-filter: blur(8px);
      }
      #toolbar button {
        padding: 8px 14px; border-radius: 8px; border: 1px solid #3a4050;
        background: #2a2f3a; color: inherit; font-size: 13px; cursor: pointer;
        display: flex; align-items: center; gap: 6px;
      }
      #toolbar button.active { background: #4f8cff; border-color: #4f8cff; color: white; }
      #toolbar button:hover { background: #353a47; }
      #toolbar button.active:hover { background: #3a78f0; }
      #toolbar button.recording { background: #dc3545; border-color: #dc3545; color: white; animation: rec-pulse 1.5s ease-in-out infinite; }
      #toolbar button.recording:hover { background: #c82333; }
      @keyframes rec-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

      #remote-videos {
        position: absolute; top: 12px; right: 12px;
        display: flex; flex-direction: column; gap: 8px;
        max-width: 320px;
        z-index: 5;
      }

      #self-preview {
        position: absolute; bottom: 80px; right: 16px;
        width: 180px; height: 135px;
        background: #0e1014;
        border: 1px solid #353a47;
        border-radius: 8px;
        overflow: hidden;
        z-index: 5;
        box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      }
      #self-preview video {
        width: 100%; height: 100%;
        object-fit: cover;
        /* Mirror so motion matches the user's expectations of a mirror. */
        transform: scaleX(-1);
        display: block;
        background: #000;
      }
      #self-preview .label {
        position: absolute; bottom: 4px; left: 6px;
        background: rgba(0,0,0,0.65); color: white;
        padding: 2px 6px; border-radius: 4px; font-size: 11px;
        pointer-events: none;
      }
      .remote-tile {
        background: #0e1014;
        border: 2px solid #353a47;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        transition: border-color 0.15s ease;
      }
      .remote-tile.speaking {
        border-color: rgba(80,220,120,0.9);
        box-shadow: 0 0 10px rgba(80,220,120,0.3);
      }
      .remote-tile video { display: block; width: 100%; max-height: 180px; background: #000; }
      .remote-tile .label {
        position: absolute; bottom: 4px; left: 6px;
        background: rgba(0,0,0,0.65); color: white;
        padding: 2px 6px; border-radius: 4px; font-size: 11px;
      }
      .remote-tile .icon-mute {
        position: absolute; top: 4px; right: 4px;
        background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 11px;
      }
      .remote-tile.muted::after {
        content: '🔇';
        position: absolute; top: 6px; right: 6px;
        background: rgba(220,53,69,0.85); border-radius: 4px;
        padding: 2px 5px; font-size: 11px; line-height: 1;
      }
      .remote-tile .no-video {
        width: 180px; height: 135px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #1a1d24;
      }
      .remote-tile .no-video-initials {
        width: 48px; height: 48px;
        border-radius: 50%;
        background: #3a4050;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; font-weight: bold; color: #e6e8ee;
      }
      .remote-tile .no-video-name {
        margin-top: 8px;
        font-size: 12px; color: #9da3b0;
      }

      #screenshare-stage {
        position: absolute;
        background: rgba(14,16,20,0.92);
        border: 1px solid #353a47;
        border-radius: 12px;
        display: none;
        flex-direction: column;
        z-index: 6;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      #screenshare-stage.visible { display: flex; }
      #screenshare-stage video {
        flex: 1;
        width: 100%;
        object-fit: contain;
        min-height: 0;
        border-radius: 0 0 12px 12px;
        background: #000;
      }
      .stage-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 6px 10px; flex-shrink: 0;
        cursor: grab; user-select: none;
        border-bottom: 1px solid #2a2f3a;
      }
      .stage-header .label {
        font-size: 12px; color: #9da3b0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .stage-controls { display: flex; gap: 4px; }
      .stage-controls button {
        background: rgba(255,255,255,0.08); border: none; color: #ccc;
        border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 13px;
        line-height: 1;
      }
      .stage-controls button:hover { background: rgba(255,255,255,0.18); }
      .stage-controls button.active { background: #4f8cff; color: white; }

      /* PiP mode (default) */
      #screenshare-stage.mode-pip {
        bottom: 80px; left: 16px;
        width: 420px; height: 280px;
        resize: both; overflow: hidden;
        min-width: 240px; min-height: 180px;
      }
      /* Side panel mode */
      #screenshare-stage.mode-side {
        top: 12px; right: 12px; bottom: 80px;
        width: 40%; min-width: 300px;
      }
      /* Full overlay mode */
      #screenshare-stage.mode-full {
        inset: 12px 12px 80px 12px;
      }

      /* Remote videos: resizable */
      #remote-videos {
        resize: vertical; overflow: auto;
        min-height: 60px; max-height: 70vh;
      }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="hud" class="hidden">
        <span class="badge" id="hud-name">-</span>
        <span id="hud-count">0 人接続中</span>
      </div>
      <div id="toolbar" class="hidden">
        <button id="btn-mic" title="マイク">🎤 マイク</button>
        <button id="btn-cam" title="カメラ">📷 カメラ</button>
        <button id="btn-screen" title="画面共有">🖥 画面共有</button>
        <button id="btn-rec" title="録画">⏺ 録画</button>
        <button id="btn-status" title="ステータス">🟢 オンライン</button>
      </div>
      <div id="remote-videos"></div>
      <div id="self-preview" class="hidden">
        <video id="self-video" autoplay muted playsinline></video>
        <span class="label">あなた</span>
      </div>
      <div id="screenshare-stage" class="mode-pip">
        <div class="stage-header" id="stage-header">
          <span class="label" id="screenshare-label"></span>
          <div class="stage-controls">
            <button data-mode="pip" class="active" title="小窓">🪟</button>
            <button data-mode="side" title="サイドパネル">◧</button>
            <button data-mode="full" title="全画面">⬜</button>
          </div>
        </div>
        <video id="screenshare-video" autoplay playsinline></video>
      </div>
      <div id="join-overlay">
        <form class="card" id="join-form">
          <h1>engawa に参加</h1>
          <input id="join-name" type="text" placeholder="名前を入力" maxlength="24" autofocus required />
          <input id="join-password" type="password" placeholder="パスワード（任意）" maxlength="64" style="margin-top: 8px;" />
          <button type="submit">入室</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
