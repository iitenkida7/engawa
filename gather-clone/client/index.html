<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gather-clone</title>
    <script>
      // Polyfills required by simple-peer (Node globals not present in browsers)
      window.global = window;
      window.process = window.process || {
        env: {},
        nextTick: function (cb) {
          var args = Array.prototype.slice.call(arguments, 1);
          queueMicrotask(function () { cb.apply(null, args); });
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1d24;
        color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #app { position: relative; width: 100vw; height: 100vh; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; }

      #join-overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        z-index: 10;
      }
      #join-overlay .card {
        background: #242832;
        border: 1px solid #353a47;
        border-radius: 12px;
        padding: 24px 28px;
        min-width: 280px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      }
      #join-overlay h1 { margin: 0 0 16px; font-size: 20px; }
      #join-overlay input {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #3a4050; background: #1a1d24; color: inherit;
        font-size: 15px;
      }
      #join-overlay button {
        margin-top: 12px; width: 100%; padding: 10px 12px;
        border-radius: 8px; border: 0; background: #4f8cff; color: white;
        font-size: 15px; cursor: pointer; font-weight: 600;
      }
      #join-overlay button:hover { background: #3a78f0; }

      #hud {
        position: absolute; top: 12px; left: 12px;
        display: flex; gap: 8px; align-items: center;
        background: rgba(20, 23, 30, 0.85);
        padding: 8px 12px; border-radius: 8px;
        font-size: 13px; pointer-events: none;
      }
      #hud .badge { background: #4f8cff; color: white; padding: 2px 8px; border-radius: 999px; font-size: 11px; }

      #toolbar {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px;
        background: rgba(20, 23, 30, 0.9);
        padding: 8px; border-radius: 12px;
        backdrop-filter: blur(8px);
      }
      #toolbar button {
        padding: 8px 14px; border-radius: 8px; border: 1px solid #3a4050;
        background: #2a2f3a; color: inherit; font-size: 13px; cursor: pointer;
        display: flex; align-items: center; gap: 6px;
      }
      #toolbar button.active { background: #4f8cff; border-color: #4f8cff; color: white; }
      #toolbar button:hover { background: #353a47; }
      #toolbar button.active:hover { background: #3a78f0; }

      #remote-videos {
        position: absolute; top: 12px; right: 12px;
        display: flex; flex-direction: column; gap: 8px;
        max-width: 320px;
        z-index: 5;
      }
      .remote-tile {
        background: #0e1014;
        border: 1px solid #353a47;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }
      .remote-tile video { display: block; width: 100%; max-height: 180px; background: #000; }
      .remote-tile .label {
        position: absolute; bottom: 4px; left: 6px;
        background: rgba(0,0,0,0.65); color: white;
        padding: 2px 6px; border-radius: 4px; font-size: 11px;
      }
      .remote-tile .icon-mute {
        position: absolute; top: 4px; right: 4px;
        background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 11px;
      }

      #screenshare-stage {
        position: absolute; inset: 12px 12px 80px 12px;
        background: rgba(0,0,0,0.85);
        border-radius: 12px;
        display: none;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #screenshare-stage.visible { display: flex; }
      #screenshare-stage video {
        max-width: 100%; max-height: 100%;
      }
      #screenshare-stage .label {
        position: absolute; top: 8px; left: 12px;
        background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 6px; font-size: 12px;
      }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="hud" class="hidden">
        <span class="badge" id="hud-name">-</span>
        <span id="hud-count">0 人接続中</span>
      </div>
      <div id="toolbar" class="hidden">
        <button id="btn-mic" title="マイク">🎤 マイク</button>
        <button id="btn-cam" title="カメラ">📷 カメラ</button>
        <button id="btn-screen" title="画面共有">🖥 画面共有</button>
      </div>
      <div id="remote-videos"></div>
      <div id="screenshare-stage">
        <span class="label" id="screenshare-label"></span>
        <video id="screenshare-video" autoplay playsinline></video>
      </div>
      <div id="join-overlay">
        <form class="card" id="join-form">
          <h1>gather-clone に参加</h1>
          <input id="join-name" type="text" placeholder="名前を入力" maxlength="24" autofocus required />
          <button type="submit">入室</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
