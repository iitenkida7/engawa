services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - client

  server:
    image: oven/bun:1.3-alpine
    working_dir: /app
    command: bun --watch src/index.ts
    ports:
      - "3000:3000"
    volumes:
      - ./engawa/server:/app
      - server_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - CLOUDFLARE_TURN_TOKEN_ID=${CLOUDFLARE_TURN_TOKEN_ID:-}
      - CLOUDFLARE_TURN_TOKEN_SECRET=${CLOUDFLARE_TURN_TOKEN_SECRET:-}
      - CLOUDFLARE_REALTIME_APP_ID=${CLOUDFLARE_REALTIME_APP_ID:-}
      - CLOUDFLARE_REALTIME_APP_TOKEN=${CLOUDFLARE_REALTIME_APP_TOKEN:-}
      - WORKSPACE_PASSWORDS=${WORKSPACE_PASSWORDS:-}

  client:
    image: oven/bun:1.3-alpine
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./engawa/client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  server_node_modules:
  client_node_modules:
  caddy_data:
  caddy_config:
