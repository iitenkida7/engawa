services:
  server:
    image: oven/bun:1.1-alpine
    working_dir: /app
    command: bun --watch src/index.ts
    ports:
      - "3000:3000"
    volumes:
      - ./engawa/server:/app
      - server_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - CLOUDFLARE_TURN_TOKEN_ID=${CLOUDFLARE_TURN_TOKEN_ID:-}
      - CLOUDFLARE_TURN_TOKEN_SECRET=${CLOUDFLARE_TURN_TOKEN_SECRET:-}
      - WORKSPACE_PASSWORDS=${WORKSPACE_PASSWORDS:-}

  client:
    image: oven/bun:1.1-alpine
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./engawa/client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  server_node_modules:
  client_node_modules:
